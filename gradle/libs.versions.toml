[versions]
agp = "8.10.1"
kotlin = "2.3.10"
ksp = "2.3.10"
composeBom = "2024.10.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"
room = "2.7.2"
work = "2.10.0"
sqlcipher = "4.17.0"
sqlite = "2.7.0"
datastore = "1.1.1"
